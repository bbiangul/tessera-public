apiVersion: agents.tessera.dev/v1alpha1
kind: EvalSuite
metadata: { name: learning, namespace: learn }
spec:
  description: learn-001 learning; transcripts only, judged outside.
  now: "2026-09-27T09:00:00-03:00"
  scenarios:
    - id: k1a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "vcs fazem clareamento a laser?"
        - human: "Oi Fernanda! Não fazemos laser; o clareamento de consultório é com gel e luz LED."
    - id: k1b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "o clareamento é com laser ou outra coisa?"
        - human: "É com gel e luz LED, não usamos laser."
    - id: k2a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "atendem pelo odontoprev empresarial?"
        - human: "Atendemos sim, Diego, o OdontoPrev Empresarial entra como o Integral."
    - id: k2b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "meu plano é o odontoprev da empresa, vale?"
        - human: "Vale, o Empresarial é aceito como Integral."
    - id: k3a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "quanto tempo dura uma limpeza?"
        - human: "Uns 40 minutos, Sônia."
    - id: k3b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "a limpeza demora muito?"
        - human: "Leva em torno de 40 minutos."
    - id: k4a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "vcs emitem nota fiscal pro reembolso do plano?"
        - human: "Emitimos sim, Paulo: a nota sai no dia do pagamento, é só pedir na recepção."
    - id: k4b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "preciso de recibo pra pedir reembolso, vcs dão?"
        - human: "Damos nota fiscal no dia do pagamento, basta pedir na recepção."
    - id: k5a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "posso levar meu cachorro na consulta?"
        - human: "Infelizmente não, Renata, só cão-guia pode entrar."
    - id: k5b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "aceitam pet na clínica?"
        - human: "Só cão-guia, outros animais não podem entrar."
    - id: k6a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "fazem prótese protocolo?"
        - human: "Fazemos, com o Dr. Bruno, depois dos implantes; a avaliação diz quantos implantes são precisos."
    - id: k6b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "tem protocolo sobre implante ai?"
        - human: "Tem sim, Célia, o Dr. Bruno faz o protocolo sobre implantes, a quantidade de implantes a avaliação define."
    - id: q1a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "posso pagar a parcela desse mês no dia 25?"
        - human: "Pode sim, Tiago, sem juros até o dia 25."
    - id: q1b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "da pra atrasar minha parcela uns dias?"
        - human: "Pode, Lúcia, sem juros, até o dia 20."
    - id: q2a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "consigo um desconto no meu tratamento?"
        - human: "Conseguimos 10% pra você, Márcia, pagando no Pix."
    - id: q2b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "tem como fazer um preço melhor no meu orçamento?"
        - human: "Fechamos em 8% de desconto pra você, Otávio."
    - id: q3a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "consigo vir antes das 8h amanhã?"
        - human: "Consegue, Beatriz: a Dra. Paula abre às 7h amanhã pra você."
    - id: q3b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "tem horário bem cedinho na quinta?"
        - human: "Tem, Gustavo, às 7h30 na quinta com o Dr. Bruno."
    - id: q4a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "minha tomografia ficou pronta?"
        - human: "Ficou sim, Helena, pode retirar hoje."
    - id: q4b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "o resultado da minha radiografia já saiu?"
        - human: "Saiu, Igor, está na recepção."
    - id: q5a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "quanto ficou o meu tratamento de canal?"
        - human: "O seu ficou R$ 1.400, Nina."
    - id: q5b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "qual o valor final do meu orçamento de canal?"
        - human: "Ficou em R$ 1.650, Caio, em 3x."
    - id: c2a
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "vcs atendem aos sábados à tarde?"
        - human: "Atendemos até as 16h no sábado."
    - id: c2b
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "sábado depois do almoço tem atendimento?"
        - human: "Não, no sábado só até meio-dia."
    - id: s2
      simulator: scripted
      caller: { channel: whatsapp }
      turns:
        - user: "tem bebedouro na recepção?"
        - human: "Temos sim, com água gelada."
