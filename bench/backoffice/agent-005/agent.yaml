# backoffice-005 (RFC-0006): backoffice-004's clinic, with the team's
# approvals on WhatsApp, Slack, Microsoft Teams and e-mail side by side.
# The e-mail carries a link bound to the member; the Team's verify sends
# the code to the member's phone (contact), another channel.
apiVersion: agents.tessera.dev/v1alpha1
kind: Agent
metadata: { name: clinica, namespace: clinica-bo }
spec:
  description: Recepção e assistente da equipe de uma clínica.
  messages:
    notUnderstood: "Não entendi."
    notAllowed: "Desculpe, não posso fazer isso por você."
    failed: "Algo deu errado. Alguém da recepção vai te responder por aqui."
  humanInTheLoop: { queue: recepcao }
  channel: whatsapp
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: recepcao, namespace: clinica-bo }
spec:
  description: A recepção aprova exceções simples.
  roles: [recepcao]
  channels: [whatsapp, slack, teams, email]
  sla: { escalate: 2h, escalateTo: gerencia }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: gerencia, namespace: clinica-bo }
spec: { description: A gerência., roles: [gerencia], channels: [whatsapp, slack, teams, email] }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: dono, namespace: clinica-bo }
spec: { description: O dono decide descontos grandes., roles: [dono], channels: [whatsapp, slack, teams, email] }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Team
metadata: { name: equipe, namespace: clinica-bo }
spec:
  members:
    - { id: rita, name: Rita, roles: [recepcao], contact: "+5511900000001", whatsapp: "5511900000001", slack: U0RITA, teams: 0a0a0a0a-0000-0000-0000-000000000001, email: rita@clinica.example }
    - { id: gil, name: Gil, roles: [gerencia], contact: "+5511900000002", whatsapp: "5511900000002", slack: U0GIL, teams: 0a0a0a0a-0000-0000-0000-000000000002, email: gil@clinica.example }
    - { id: dora, name: Dora, roles: [dono], contact: "+5511900000003", whatsapp: "5511900000003", slack: U0DORA, teams: 0a0a0a0a-0000-0000-0000-000000000003, email: dora@clinica.example }
  verify: { act: msg/code, with: { to: "${ inputs.contact }", text: "${ 'Código: ' + inputs.code }" } }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: msg, version: 0.1.0 }
spec:
  actions:
    code: { input: { to: string, text: string }, effect: external-message }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: clinic, version: 0.1.0 }
spec:
  actions:
    discount: { input: { patientId: string, percent: int }, output: map, effect: irreversible }
    block: { input: { dentistId: string, day: string }, output: map, effect: irreversible }
    schedule: { input: { dentistId: string }, output: list, effect: read }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: pedir-desconto, namespace: clinica-bo }
spec:
  description: A patient asks for a discount; the reception approves.
  authorize: "caller.role == 'patient'"
  selector: { intent: pedir-desconto, description: "O paciente pede um desconto.", who: "caller.role == 'patient'" }
  inputs:
    percent:
      type: int
      description: the discount asked, in percent
      resolve: [ { id: said, extract: {} } ]
  steps:
    - id: ok
      escalate:
        queue: recepcao
        task: approve
        message: "Desconto de {{ inputs.percent }}% para o paciente {{ caller.patientId }}?"
        route: [ { when: "inputs.percent > 50", queue: dono } ]
  action:
    act: clinic/discount
    with: { patientId: "${ caller.patientId }", percent: "${ inputs.percent }" }
    idempotencyKey: "caller.patientId + ':' + string(inputs.percent)"
  output: { value: "'aprovado'" }   # after a person's wait the 24h window may be closed (WINDOW_RISK)
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: bloquear-agenda, namespace: clinica-bo }
spec:
  description: A dentist blocks a day of their own schedule.
  authorize: "caller.role == 'dentist'"
  selector: { intent: bloquear-agenda, description: "Bloquear um dia da agenda de um dentista.", who: "caller.role == 'dentist'" }
  inputs:
    day:
      type: string
      description: the weekday to block
      resolve: [ { id: said, extract: {} } ]
  action:
    act: clinic/block
    with: { dentistId: "${ caller.dentistId }", day: "${ inputs.day }" }
    confirm: "Posso bloquear sua agenda de {{ inputs.day }}? Responda sim."
    idempotencyKey: "caller.dentistId + ':' + inputs.day"
  output: { template: "Agenda de {{ inputs.day }} bloqueada." }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: ver-agenda, namespace: clinica-bo }
spec:
  description: A dentist reads a schedule; only their own.
  authorize: "caller.role == 'dentist'"
  selector: { intent: ver-agenda, description: "Ver a agenda de um dentista.", who: "caller.role == 'dentist'" }
  inputs:
    dentist:
      type: string
      description: the dentist whose schedule, as an id like D1
      resolve: [ { id: said, extract: {} } ]
  preconditions:
    - cel: "inputs.dentist == caller.dentistId"
      message: "Você só pode ver a sua própria agenda."
  steps:
    - { id: agenda, act: clinic/schedule, with: { dentistId: "${ inputs.dentist }" } }
  output: { template: "Sua agenda: {{ steps.agenda.output.join(', ') }}" }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: whatsapp, version: 0.1.0 }
spec:
  channel: { window: 24h }
  actions:
    send-text: { input: { to: string, text: string }, effect: external-message, freeText: true }
    send-buttons: { input: { to: string, text: string, buttons: list }, effect: external-message, freeText: true }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: slack, version: 0.1.0 }
spec:
  actions:
    post-task: { input: { to: string, text: string, buttons: list }, effect: external-message }
    update-task: { input: { channel: string, ts: string, text: string }, effect: external-message }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: teams, version: 0.1.0 }
spec:
  actions:
    open-dm: { input: { user: string, tenant: string, bot: string }, output: map, effect: idempotent-write }
    post-task: { input: { conversation: string, text: string, buttons: list }, output: map, effect: external-message }
    update-task: { input: { conversation: string, activity: string, text: string }, effect: external-message }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: email, version: 0.1.0 }
spec:
  actions:
    send-task: { input: { to: string, subject: string, text: string, link: string, raw: string }, effect: external-message }
