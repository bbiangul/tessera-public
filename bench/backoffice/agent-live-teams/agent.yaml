# The backoffice-001 live clinic with the team's approvals on Microsoft
# Teams (backoffice-004): tessera serve --teams sends tasks through the
# teams plugin below (the Bot Framework's Connector API, with a token by
# the client-credentials grant). Put your tenant ID in tokenUrl. For a
# check against a local stand-in, point baseUrl and tokenUrl at it and
# pass --allow-private-networks.
apiVersion: agents.tessera.dev/v1alpha1
kind: Agent
metadata: { name: clinica, namespace: clinica-bo }
spec:
  description: Recepção e assistente da equipe de uma clínica.
  messages:
    notUnderstood: "Não entendi."
    notAllowed: "Desculpe, não posso fazer isso por você."
    failed: "Algo deu errado. Alguém da recepção vai te responder por aqui."
    denied: "A clínica não aprovou este pedido. Se quiser, fale com a recepção."
  humanInTheLoop: { queue: recepcao }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: recepcao, namespace: clinica-bo }
spec:
  description: A recepção aprova exceções simples.
  roles: [recepcao]
  channels: [teams]
  sla: { escalate: 2h, escalateTo: gerencia }
  notify: [ { act: msg/notify, with: { queue: "${ inputs.queue }", text: "${ inputs.text }", link: "${ inputs.link }" } } ]
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: gerencia, namespace: clinica-bo }
spec: { description: A gerência., roles: [gerencia], channels: [teams] }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: HumanQueue
metadata: { name: dono, namespace: clinica-bo }
spec:
  description: O dono decide descontos grandes.
  roles: [dono]
  channels: [teams]
  notify: [ { act: msg/notify, with: { queue: "${ inputs.queue }", text: "${ inputs.text }", link: "${ inputs.link }" } } ]
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Team
metadata: { name: equipe, namespace: clinica-bo }
spec:
  members:
    - { id: rita, name: Rita, roles: [recepcao], contact: "+5511900000001", teams: 0a0a0a0a-0000-0000-0000-000000000001 }
    - { id: gil, name: Gil, roles: [gerencia], contact: "+5511900000002", teams: 0a0a0a0a-0000-0000-0000-000000000002 }
    - { id: dora, name: Dora, roles: [dono], contact: "+5511900000003", teams: 0a0a0a0a-0000-0000-0000-000000000003 }
  verify: { act: msg/code, with: { to: "${ inputs.contact }", text: "${ 'Código: ' + inputs.code }" } }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: msg, version: 0.1.0 }
spec:
  sql:
    migrations:
      - CREATE TABLE codes (key TEXT UNIQUE, to_contact TEXT, text TEXT)
      - CREATE TABLE notifications (key TEXT UNIQUE, queue TEXT, text TEXT, link TEXT)
  actions:
    code:
      input: { to: string, text: string }
      effect: external-message
      sql: { query: "INSERT INTO codes (key, to_contact, text) VALUES (:idempotencyKey, :to, :text) ON CONFLICT (key) DO NOTHING", params: { to: "${ inputs.to }", text: "${ inputs.text }" } }
    notify:
      input: { queue: string, text: string, link: string }
      effect: external-message
      sql: { query: "INSERT INTO notifications (key, queue, text, link) VALUES (:idempotencyKey, :q, :t, :l) ON CONFLICT (key) DO NOTHING", params: { q: "${ inputs.queue }", t: "${ inputs.text }", l: "${ inputs.link }" } }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: clinic, version: 0.1.0 }
spec:
  sql:
    migrations:
      - CREATE TABLE discounts (key TEXT UNIQUE, patient TEXT, percent INTEGER)
      - CREATE TABLE blocks (key TEXT UNIQUE, dentist TEXT, day TEXT)
      - CREATE TABLE schedule (dentist TEXT, item TEXT)
      - INSERT INTO schedule (dentist, item) VALUES ('D1', '9h consulta'), ('D1', '14h retorno'), ('D2', '10h cirurgia')
  actions:
    discount:
      input: { patientId: string, percent: int }
      effect: irreversible
      sql: { query: "INSERT INTO discounts (key, patient, percent) VALUES (:idempotencyKey, :p, :n) ON CONFLICT (key) DO NOTHING", params: { p: "${ inputs.patientId }", n: "${ inputs.percent }" } }
    block:
      input: { dentistId: string, day: string }
      effect: irreversible
      sql: { query: "INSERT INTO blocks (key, dentist, day) VALUES (:idempotencyKey, :d, :day) ON CONFLICT (key) DO NOTHING", params: { d: "${ inputs.dentistId }", day: "${ inputs.day }" } }
    schedule:
      input: { dentistId: string }
      output: list
      effect: read
      sql: { query: "SELECT item FROM schedule WHERE dentist = :d ORDER BY item", params: { d: "${ inputs.dentistId }" } }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: pedir-desconto, namespace: clinica-bo }
spec:
  description: A patient asks for a discount; the reception approves.
  authorize: "caller.role == 'patient'"
  selector: { intent: pedir-desconto, description: "O paciente pede um desconto.", who: "caller.role == 'patient'" }
  inputs:
    percent:
      type: int
      description: the discount asked, in percent
      resolve: [ { id: said, extract: {} } ]
  steps:
    - id: ok
      escalate:
        queue: recepcao
        task: approve
        message: "Desconto de {{ inputs.percent }}% para o paciente {{ caller.patientId }}?"
        route: [ { when: "inputs.percent > 50", queue: dono } ]
  action:
    act: clinic/discount
    with: { patientId: "${ caller.patientId }", percent: "${ inputs.percent }" }
    idempotencyKey: "caller.patientId + ':' + string(inputs.percent)"
  output: { template: "Desconto de {{ inputs.percent }}% aprovado." }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: bloquear-agenda, namespace: clinica-bo }
spec:
  description: A dentist blocks a day of their own schedule.
  authorize: "caller.role == 'dentist'"
  selector: { intent: bloquear-agenda, description: "Bloquear um dia da agenda de um dentista.", who: "caller.role == 'dentist'" }
  inputs:
    day:
      type: string
      description: the weekday to block
      resolve: [ { id: said, extract: {} } ]
  action:
    act: clinic/block
    with: { dentistId: "${ caller.dentistId }", day: "${ inputs.day }" }
    confirm: "Posso bloquear sua agenda de {{ inputs.day }}? Responda sim."
    idempotencyKey: "caller.dentistId + ':' + inputs.day"
  output: { template: "Agenda de {{ inputs.day }} bloqueada." }
---
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata: { name: ver-agenda, namespace: clinica-bo }
spec:
  description: A dentist reads a schedule; only their own.
  authorize: "caller.role == 'dentist'"
  selector: { intent: ver-agenda, description: "Ver a agenda de um dentista.", who: "caller.role == 'dentist'" }
  inputs:
    dentist:
      type: string
      description: the dentist whose schedule, as an id like D1
      resolve: [ { id: said, extract: {} } ]
  preconditions:
    - cel: "inputs.dentist == caller.dentistId"
      message: "Você só pode ver a sua própria agenda."
  steps:
    - { id: agenda, act: clinic/schedule, with: { dentistId: "${ inputs.dentist }" } }
  output: { template: "Sua agenda: {{ steps.agenda.output.map(x, x.item).join(', ') }}" }
---
apiVersion: plugins.tessera.dev/v1alpha1
kind: PluginManifest
metadata: { name: teams, version: 0.1.0 }
spec:
  egress: { hosts: [smba.trafficmanager.net, login.microsoftonline.com] }
  connection:
    baseUrl: https://smba.trafficmanager.net/teams
    oauth2:
      tokenUrl: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token
      clientId: TEAMS_APP_ID
      clientSecret: TEAMS_APP_PASSWORD
      scope: https://api.botframework.com/.default
  actions:
    open-dm:
      input: { user: string, tenant: string, bot: string }
      output: map
      effect: idempotent-write
      http:
        method: POST
        path: /v3/conversations
        body:
          bot: "${ {'id': inputs.bot} }"
          members: "${ [{'id': inputs.user}] }"
          isGroup: false
          channelData: "${ {'tenant': {'id': inputs.tenant}} }"
    post-task:
      input: { conversation: string, text: string, buttons: list }
      output: map
      effect: external-message
      http:
        method: POST
        path: "/v3/conversations/{{ inputs.conversation }}/activities"
        body:
          type: message
          attachments: "${ [{'contentType': 'application/vnd.microsoft.card.adaptive', 'content': {'type': 'AdaptiveCard', '$schema': 'http://adaptivecards.io/schemas/adaptive-card.json', 'version': '1.4', 'body': [{'type': 'TextBlock', 'text': inputs.text, 'wrap': true}], 'actions': inputs.buttons.map(b, {'type': 'Action.Submit', 'title': b.title, 'style': b.style, 'data': {'tessera': b.id}})}}] }"
    update-task:
      input: { conversation: string, activity: string, text: string }
      effect: external-message
      http:
        method: PUT
        path: "/v3/conversations/{{ inputs.conversation }}/activities/{{ inputs.activity }}"
        body: { type: message, text: "${ inputs.text }" }
