# Two destinations side by side (RFC-0009): the whole trip to each (the
# cheapest and the recommended combination), and how much one saves. It
# calls quote-trip for each, so both quotes are remembered and "reserva o
# pacote de Salvador" finds its own.
apiVersion: agents.tessera.dev/v1alpha1
kind: Function
metadata:
  name: compare-trips
  namespace: traveler
spec:
  description: Compares the whole trip (flight and stay) to two destinations, with the totals.
  selector:
    intent: compare-destinations
    description: "O usuário está em dúvida entre duas ou mais CIDADES de destino e quer comparar o preço da viagem para cada uma, só o voo ou com hotel (Natal ou Maceió?, Salvador ou Porto Seguro, quanto fica cada um, qual sai mais barato). Não é escolher entre voos ou hotéis que eu já mostrei (qual desses voos você recomenda?), nem pedir opinião sobre destinos (qual é mais bonito?, qual vale mais a pena?, o que tem pra fazer lá?)."
  inputs:
    trip:
      type: map
      description: the trip being planned in this conversation, when it was touched in the last 14 days
      resolve:
        - { id: saved, fromAction: trip/get, with: { conversation: "${ conversation.id }" } }
        - id: fresh
          when: "sources.saved.output != null && timestamp(sources.saved.output.updated_at) > event.time - duration('336h')"
          value: "sources.saved.output"
        - { id: none, value: "{}" }
    profile:
      type: map
      description: the traveler's saved preferences (plugins/profile.yaml)
      resolve:
        - { id: saved, fromAction: profile/get, with: { user: "${ has(caller.userId) ? caller.userId : conversation.id }" } }
        - { id: none, value: "{}" }
    newDates:
      type: bool
      description: whether the message gives a new departure day or a new period for the trip
      resolve:
        - { id: said, extract: { instructions: "true when the message gives a departure or check-in day, a month, a holiday or another period for the trip (dia 15, em dezembro, no feriado, semana que vem); false when it gives no date, gives only the return or check-out day, or refers to dates already given (nas mesmas datas, nessas datas, no mesmo período)" } }
        - { id: default, value: "false" }
    destinations:
      type: list<string>
      description: "the destinations the user compares (Natal ou Maceió), full names (Rio → Rio de Janeiro), in the order named"
      resolve:
        - { id: said, extract: { instructions: "null unless the message names two or more destinations" } }
        - id: trip
          when: "has(inputs.trip.destination) && inputs.trip.destination != null && has(inputs.trip.other) && inputs.trip.other != null && inputs.trip.other != ''"
          value: "[inputs.trip.destination, inputs.trip.other]"
        - id: asked
          ask: { text: "Quais destinos você quer comparar?", minConfidence: 0.7, onLowConfidence: ask-user }
      onUnresolved:
        - respond: { template: "Para comparar, me diga as duas cidades, por exemplo: Natal ou Maceió." }
    origin:
      type: string
      description: "the city the user leaves from, its full name (SP → São Paulo, BH → Belo Horizonte)"
      resolve:
        - { id: said, extract: { instructions: "null unless the message names where the trip starts" } }
        - { id: trip, when: "has(inputs.trip.origin) && inputs.trip.origin != null", value: "inputs.trip.origin" }
        - { id: saved, when: "has(inputs.profile.home_city) && inputs.profile.home_city != null", value: "inputs.profile.home_city" }
        - { id: home, when: "has(caller.homeCity)", value: "caller.homeCity" }
        - id: asked
          ask: { text: "De onde você sai?", minConfidence: 0.7, onLowConfidence: ask-user }
    departDate:
      type: date
      description: the day the trip starts
      resolve:
        - id: said
          extract: { instructions: "the first day of the trip as YYYY-MM-DD: 'dia 20 de outubro', '15/11' and 'amanhã' each give a day; resolve relative days from STATE.now; a day without a year is its next occurrence; null only when the message gives no day (only a month, or nothing)" }
        - id: trip
          when: "!inputs.newDates && has(inputs.trip.depart) && inputs.trip.depart != null && date(inputs.trip.depart, 'America/Sao_Paulo') >= startOfDay(event.time, 'America/Sao_Paulo')"
          value: "inputs.trip.depart"
        - id: asked
          ask: { text: "Qual o dia da ida e o da volta?", minConfidence: 0.7, onLowConfidence: ask-user }
    returnDate:
      type: date
      description: the day the trip ends
      resolve:
        - { id: said, extract: { instructions: "a stay (uma semana, 10 dias) counts from the departure; null when not given" } }
        - id: trip
          when: "has(inputs.trip.return_date) && inputs.trip.return_date != null && inputs.trip.return_date > inputs.departDate"
          value: "inputs.trip.return_date"
        - id: asked
          ask: { text: "E a volta, em que dia?", minConfidence: 0.7, onLowConfidence: ask-user }
    childrenAges:
      type: list<int>
      description: ages of the children traveling; a baby under 1 year is 0
      resolve:
        - { id: said, extract: { instructions: "null when the message mentions no child" } }
        - { id: trip, when: "has(inputs.trip.children) && inputs.trip.children != null", value: "inputs.trip.children" }
        - { id: default, value: "[]" }
    partySize:
      type: int
      description: "how many people travel in total, when the message counts them (nós 3, 2 pessoas)"
      resolve:
        - { id: said, extract: { instructions: "null unless the message gives a number of people" } }
      onUnresolved:
        - fallback: { useNull: true }
    adults:
      type: int
      description: "adults traveling, including the user, when the message says who goes (eu e minha esposa: 2)"
      resolve:
        - { id: said, extract: { instructions: "count only adults; null unless the message says how many adults or who the adults are" } }
        - { id: counted, when: "inputs.partySize != null && inputs.partySize - size(inputs.childrenAges) >= 1", value: "inputs.partySize - size(inputs.childrenAges)" }
        - { id: trip, when: "has(inputs.trip.adults) && inputs.trip.adults != null", value: "inputs.trip.adults" }
        - { id: default, value: "1" }
    timeConstraint:
      type: string
      description: wishes about the flight time, in the user's words (de manhã)
      resolve:
        - { id: said, extract: {} }
        - { id: none, value: "''" }
    cheap:
      type: bool
      description: whether the user asks for the cheapest trip
      resolve:
        - { id: said, extract: { instructions: "true when the message asks for cheaper, the cheapest or a low price; false otherwise" } }
        - { id: default, value: "false" }
  preconditions:
    - cel: "size(inputs.destinations) >= 2"
      message: "Me diga os dois destinos que você quer comparar, por exemplo: Natal ou Maceió."
    - cel: "date(inputs.departDate, 'America/Sao_Paulo') >= startOfDay(event.time, 'America/Sao_Paulo')"
      message: "Essa data de ida já passou. Para quando você quer a viagem?"
    - cel: "inputs.returnDate > inputs.departDate"
      message: "A volta precisa ser depois da ida."
  steps:
    - id: first
      call: quote-trip
      with:
        destination: "${ inputs.destinations[0] }"
        origin: "${ inputs.origin }"
        departDate: "${ inputs.departDate }"
        returnDate: "${ inputs.returnDate }"
        adults: "${ inputs.adults }"
        childrenAges: "${ inputs.childrenAges }"
        partySize: 0
        newDates: true
        area: ""
        hotelChoice: ""
        flightChoice: ""
        timeConstraint: "${ inputs.timeConstraint }"
        cheap: "${ inputs.cheap }"
        returnDay: 0
    - id: second
      call: quote-trip
      with:
        destination: "${ inputs.destinations[1] }"
        origin: "${ inputs.origin }"
        departDate: "${ inputs.departDate }"
        returnDate: "${ inputs.returnDate }"
        adults: "${ inputs.adults }"
        childrenAges: "${ inputs.childrenAges }"
        partySize: 0
        newDates: true
        area: ""
        hotelChoice: ""
        flightChoice: ""
        timeConstraint: "${ inputs.timeConstraint }"
        cheap: "${ inputs.cheap }"
        returnDay: 0
    - id: view
      compute:
        starlark:
          script: ../scripts/present.star
          function: compare
          with:
            quotes: "${ [steps.first.output, steps.second.output] }"
            origin: "${ inputs.origin }"
            depart: "${ inputs.departDate }"
            ret: "${ inputs.returnDate }"
            adults: "${ inputs.adults }"
            children: "${ inputs.childrenAges }"
  output:
    template: "{{ steps.view.output }}"
